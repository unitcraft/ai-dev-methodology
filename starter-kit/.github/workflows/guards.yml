# Зачем: проверить на сервере то же, что хуки git проверяют локально, и сообщить о нарушении, которое
#     обошло хук (--no-verify, коммит без установленных хуков).
# Проверяет: задание guards - синтаксис скриптов sh (dash), маскирование списка имён, стражи по маске
#     (run-all.sh --ci), страж секретов по дереву, мета-проверку подключения и параметров, подпись и
#     сообщение каждого коммита пуша или запроса на слияние (commit-range.sh и guard-commit-message.py --ci);
#     задание selftests - все самотесты, «доказательство красного» и прогон на пустом корне. Любой красный
#     вердикт - красный прогон, «пропущено» у обязательного стража в CI тоже красный.
# Не проверяет: тесты самого проекта (их задание проект заводит сам) и защиту целевой ветки (её настраивают
#     в хостинге кода).
# Правило: README комплекта, «Страж с самотестом и вызывающим».
#
# Пути и имена здесь записаны явно (синтаксис CI не читает guards.conf); check-wiring.py сверяет их с
# параметрами: папка стражей - GUARDS_DIR, имя секрета списка запрещённых имён - PRIVATE_NAMES_VAR.
# Целевая ветка берётся из guards.conf (MAIN_BRANCH). Без секрета страж имён красный с подсказкой.
name: guards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    env:
      GUARDS_PRIVATE_NAMES: ${{ secrets.GUARDS_PRIVATE_NAMES }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mask the names list in the log
        run: sh scripts/guards/ci-mask.sh GUARDS_PRIVATE_NAMES
      - name: Syntax of shell scripts under dash
        run: |
          for f in $(git ls-files 'scripts/*.sh' 'scripts/guards/*.sh' 'scripts/guards/lib/*.sh' 'scripts/guards/selftest/*.sh' 'scripts/githooks/*'); do
            dash -n "$f" || exit 1
          done
      - name: Guards by mask
        run: sh scripts/guards/run-all.sh --ci
      - name: Secrets guard on the tree
        run: python scripts/guards/guard-secrets.py --tree
      - name: Wiring and parameters meta-check
        run: python scripts/guards/check-wiring.py
      - name: Signature and message of every commit of the push
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          main=$(python scripts/guards/lib/conf.py get MAIN_BRANCH) || exit 1
          if [ "$EVENT" = pull_request ]; then old=$PR_BASE; new=$PR_HEAD; else old=$BEFORE; new=$AFTER; fi
          commits=$(sh scripts/guards/commit-range.sh --old "$old" --new "$new" --remote origin --main "refs/remotes/origin/$main") || exit 1
          rc=0
          for c in $commits; do
            python scripts/guards/guard-commit-message.py --commit "$c" --ci || rc=1
          done
          exit $rc

  selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-tests
        run: sh scripts/guards/selftest/run-selftests.sh
      - name: Red proof (guards replaced by stubs)
        run: sh scripts/guards/prove-red.sh
      - name: Empty root and skeleton
        run: sh scripts/guards/probe-empty-root.sh
