# Параметры стражей проекта. Формат: КЛЮЧ=значение, по ключу на строку; решётка первым знаком —
# комментарий; кавычки не нужны, пробелы по краям значения отбрасываются. Неизвестный ключ, повтор
# ключа (кроме TASK_DOC_RULE и RATCHET_GUARD) и отсутствие обязательного ключа — красный вердикт с подсказкой.
# Каждый ключ описан в docs/guards.md (README комплекта), раздел «Параметры проекта».

# --- Раскладка (у этих ключей есть значения по умолчанию: раскладка самого комплекта) ----------
# Меняя путь, поменяйте и вызывающих: хуки git, задание CI и настройки агента называют пути явно;
# check-wiring.py сверяет их с этими ключами.
GUARDS_DIR=scripts/guards
GITHOOKS_DIR=scripts/githooks
HOOKS=pre-commit commit-msg pre-push
AGENT_HOOKS_DIR=scripts/agent-hooks
AGENT_SETTINGS=.claude/settings.json
CI_WORKFLOW=.github/workflows/guards.yml
INSTALLER=scripts/install-hooks.sh
EXPECTED_EMAIL_KEY=guards.expectedEmail

# --- Обязательные ключи: решение проекта -------------------------------------------------------
# Значения ниже — ПРЕДЛОЖЕНИЯ: выбор проекта-источника, чтобы комплект был зелёным сразу после
# установки; это не умолчания (убранная строка — красный вердикт). Просмотрите и смените под проект:
# docs/guards.md (README комплекта), «Параметры проекта», «Из коробки».
# Целевая ветка: от неё считается диапазон пуша новой ветки (pre-push и CI). ПРЕДЛОЖЕНИЕ.
MAIN_BRANCH=main

# Список запрещённых имён (имена приватных проектов, заказчиков, репозиториев) хранится вне
# репозитория: переменная окружения (в CI — секрет с тем же именем), иначе файл по пути из второй
# переменной, иначе файл по умолчанию. Имя переменной повторено в задании CI (секрет и маскирование).
# ПРЕДЛОЖЕНИЕ.
PRIVATE_NAMES_VAR=GUARDS_PRIVATE_NAMES
PRIVATE_NAMES_FILE_VAR=GUARDS_PRIVATE_NAMES_FILE
PRIVATE_NAMES_FILE=~/.config/guards/private-names.txt

# Политика сообщений коммитов (guard-commit-message.py). Из коробки подписи не требуются; проект может
# включить более строгие режимы: COMMIT_SIGNOFF=required (требовать Signed-off-by),
# COMMIT_FORBIDDEN_TRAILERS=<список> (запретить указанные трейлеры; none — не запрещать),
# COMMIT_ASCII_ONLY=yes (только ASCII) и COMMIT_AUTHOR_EMAIL_CHECK=yes (проверять адрес автора).
COMMIT_SIGNOFF=off
COMMIT_FORBIDDEN_TRAILERS=Co-authored-by
COMMIT_ASCII_ONLY=yes
COMMIT_AUTHOR_EMAIL_CHECK=yes

# Правила хука агента (guard-git.py); перечень и смысл — docs/guards.md, «Хук агента»; none — выключить все.
# ПРЕДЛОЖЕНИЕ: включены все.
AGENT_HOOK_RULES=add-all stash force-push no-verify rewrite-history config-user commit-scope flag-after-dashes backtick ps-write commit-m-backtick

# --- Форматы проекта: комплект их не выдумывает ------------------------------------------------
# off — правило выключено решением проекта (страж печатает «судить нечего» с этой причиной).
# Пример форм из документов методологии (task-sessions.md, task-runner.md); ПАПКА_ЗАДАЧ замените
# путём к папке задач проекта, иначе страж напишет «мишень потеряна»:
#TASK_DOC_RULE=first-line ^ПАПКА_ЗАДАЧ/[^/]+/(spec|plan)\.md$ ^Статус: (черновик|утверждено)
#TASK_DOC_RULE=first-line ^ПАПКА_ЗАДАЧ/[^/]+/[a-z-]*review-(?P<n>[0-9]+)\.md$ ^Заход (?P<n>[0-9]+): существенных [0-9]+, поверхностных [0-9]+, проб [0-9]+
#TASK_DOC_RULE=every-line ^ПАПКА_ЗАДАЧ/[^/]+/progress\.log$ ^[^ \t]+ [0-9]+/[0-9]+ .+$
TASK_DOC_RULE=off

# Страж рукописных таблиц статусов: образец пути папки задачи, на которую ссылается первая ячейка.
#STATUS_TABLE_TASK_PATH=^ПАПКА_ЗАДАЧ/[0-9]+[^/]*/?$
STATUS_TABLE_TASK_PATH=off
STATUS_TABLE_COLUMN=статус|status|state

# Страж пустых тестов: образец пути файла теста, образец проверки, образец комментария.
#TEST_FILES=^tests/.*_test\.py$
#TEST_CHECK=\bassert\b
#TEST_COMMENT=#.*$
TEST_FILES=off

# --- Храповик долга (check-ratchet.py): поимённая база нарушений, которая может только убывать -----
# Страж check-* под храповиком, имя файла; ключ повторяется. Такой страж run-all.sh и pre-push не зовут
# напрямую: его находки судит храповик по базе. off — храповик не подключён (страж печатает «судить
# нечего»). Пример: RATCHET_GUARD=check-text-hygiene.py
RATCHET_GUARD=off
# Файл базы от корня репозитория; новый проект начинает с пустого файла.
# Формат — docs/guards.md (README комплекта), «Храповик долга».
RATCHET_BASELINE=scripts/guards/ratchet.txt
